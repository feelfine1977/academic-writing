name: Portable application checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Writing Lab - café
    steps:
      - uses: actions/checkout@v4
        with:
          path: Writing Lab - café
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Fresh install and copied-vault smoke check
        run: python scripts/portable_smoke.py --output portable-smoke.json
      - run: python -m pytest -q
      - run: node --test tests/text-coach-state.test.mjs tests/reading.test.mjs tests/section-writing.test.mjs tests/tutor-grounding.test.mjs tests/writing-start.test.mjs tests/voice-notes.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-smoke-${{ matrix.os }}
          path: Writing Lab - café/portable-smoke.json
          if-no-files-found: ignore
